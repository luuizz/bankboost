# Produção no Droplet: app (imagem do GHCR) + MySQL + Caddy (HTTPS automático).
# Fica em /opt/bankboost junto com o .env e o Caddyfile.

services:
    app:
        image: ghcr.io/luuizz/bankboost:${IMAGE_TAG:-latest}
        restart: unless-stopped
        env_file: .env
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            LOG_CHANNEL: stderr
        volumes:
            - storage:/var/www/html/storage/app
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        command: ['--innodb-buffer-pool-size=128M', '--performance-schema=OFF']
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 10

    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        environment:
            APP_DOMAIN: ${APP_DOMAIN}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - app

volumes:
    storage:
    mysql:
    caddy_data:
    caddy_config:
