name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint + testes)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, bcmath, gd
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test -v

      - name: Testes
        run: php artisan test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Imagem e stack de produção
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t ghcr.io/luuizz/bankboost:ci .

      - name: Sobe app + MySQL + Caddy com o compose de produção
        working-directory: deploy
        run: |
          cp .env.production.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          sed -i "s|^APP_DOMAIN=.*|APP_DOMAIN=localhost|; s|^APP_URL=.*|APP_URL=https://localhost|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-secret|; s|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=ci-root|" .env
          IMAGE_TAG=ci docker compose up -d

      - name: Confere o site por HTTPS
        working-directory: deploy
        run: |
          for i in $(seq 1 30); do
            curl -fsSk https://localhost/up >/dev/null && break
            sleep 5
          done
          curl -fsSk https://localhost/up
          curl -fsSk https://localhost/ | grep -q "Desperte seu potencial financeiro"
          curl -fsSk https://localhost/blog | grep -q "Desafio das 52 semanas"
          curl -fsSkI https://localhost/painel | grep -qi "location: https://localhost/entrar"
          echo "Stack de produção respondendo"

      - name: Logs em caso de falha
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail=150
